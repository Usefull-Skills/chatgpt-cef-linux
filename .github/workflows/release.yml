name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag and version
        shell: pwsh
        run: |
          $version=(Get-Content VERSION -Raw).Trim()
          if('${{ github.ref_name }}' -ne "v$version"){ throw "Tag/version mismatch" }
      - name: Install verified pinned Inno Setup
        shell: pwsh
        run: |
          ./scripts/install-inno-setup.ps1
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Build Windows native payload
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
      - name: Package Windows ZIP and Setup
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          ./scripts/build-windows-installer.ps1
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          $version=(Get-Content VERSION -Raw).Trim()
          $setup="dist/installer/Remote-Commander-Browser-Setup-v$version.exe"
          if(-not(Test-Path $setup)){ throw 'Setup missing' }
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + [IO.Path]::GetFileName($setup) |
            Set-Content "dist/SHA256SUMS-setup-v$version.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: browser-release-windows
          path: |
            dist/remote-commander-browser-v*-windows-x86_64.zip
            dist/SHA256SUMS-windows-v*.txt
            dist/installer/Remote-Commander-Browser-Setup-v*.exe
            dist/SHA256SUMS-setup-v*.txt
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl bzip2 cppcheck libgtk-3-dev libnss3-dev libx11-dev libxcomposite-dev libxdamage-dev libxext-dev libxfixes-dev libxrandr-dev libgbm-dev libpango1.0-dev libcups2-dev libdrm-dev libasound2-dev fonts-vazirmatn xvfb xauth
      - name: Build and package Linux
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/static-qa.sh
          ./scripts/fetch-cef.sh
          ./scripts/build-release.sh
          sandbox="$(realpath build/bin/chrome-sandbox)"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: browser-release-linux
          path: |
            dist/remote-commander-browser-v*-linux-x86_64.tar.gz
            dist/remote-commander-browser-v*-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-release-*
          path: dist/release
          merge-multiple: true
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="v$version"
          test "$GITHUB_REF_NAME" = "$tag"
          test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          notes="docs/RELEASE_$version.md"
          test -f "$notes"
          cd dist/release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | LC_ALL=C sort | while read -r f; do sha256sum "$f"; done > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cd ../..
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "RELEASE_ALREADY_EXISTS $tag"
            exit 0
          fi
          mapfile -t assets < <(find dist/release -maxdepth 1 -type f -printf '%p\n' | LC_ALL=C sort)
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Remote Commander Browser $tag" --notes-file "$notes"

name: Browser QA profile isolation guard

on:
  pull_request:
  push:
    branches:
      - fix/browser-qa-profile-isolation-r1

permissions:
  contents: read

jobs:
  profile-isolation-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python for source contract assertions
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify QA profile cannot fall back to production
        run: python scripts/profile-isolation-contract-test.py
      - name: Verify previous navigation/STOP contracts
        run: python scripts/native-navigation-contract-test.py

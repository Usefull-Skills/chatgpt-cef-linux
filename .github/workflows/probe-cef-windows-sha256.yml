name: Probe pinned CEF Windows archive

on:
  push:
    branches: [feature/v0.8.0-rc.2-windows]
    paths:
      - '.github/workflows/probe-cef-windows-sha256.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download exact upstream CEF Windows archive and report SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $url='https://cef-builds.spotifycdn.com/cef_binary_154.0.32%2Bg682c378%2Bchromium-154.0.8037.58_windows64_minimal.tar.bz2'
          $file=Join-Path $env:RUNNER_TEMP 'cef_windows64_minimal.tar.bz2'
          Invoke-WebRequest -Uri $url -OutFile $file
          $sha=(Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
          $bytes=(Get-Item $file).Length
          Write-Host "CEF_WINDOWS_SHA256=$sha"
          Write-Host "CEF_WINDOWS_BYTES=$bytes"
          if($bytes -lt 100MB){ throw "archive unexpectedly small: $bytes" }

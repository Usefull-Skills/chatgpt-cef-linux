name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  companion-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build CEF-free contract gate with sanitizers
        run: |
          mkdir -p .qa
          c++ --version | tee .qa/companion-compiler.out
          cmake --version | tee .qa/companion-cmake.out
          sha256sum src/commander_companion.cc src/commander_companion_test.cc src/companion-emitted-fixture.json | tee .qa/companion-source-sha256.out
          cmake -S . -B build-companion -G Ninja \
            -DCGWA_COMPANION_TESTS_ONLY=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS='-Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer'
          cmake --build build-companion -j2
      - name: Run native contract and Linux private-file guards
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p .qa
          ctest --test-dir build-companion --verbose --output-on-failure | tee .qa/companion-contract.out
      - name: Preserve contract evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-contract-evidence
          path: .qa/companion-*.out
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  linux-release-build:
    needs: companion-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build curl bzip2 cppcheck \
            libgtk-3-dev libnss3-dev libx11-dev libxcomposite-dev \
            libxdamage-dev libxext-dev libxfixes-dev libxrandr-dev \
            libgbm-dev libpango1.0-dev libcups2-dev libdrm-dev \
            libasound2-dev fonts-vazirmatn xvfb xauth

      - name: Static QA
        run: ./scripts/static-qa.sh

      - name: Fetch pinned CEF
        run: ./scripts/fetch-cef.sh

      - name: Build release
        run: ./scripts/build-release.sh

      - name: Dependency check
        run: |
          if ldd build/bin/chatgpt-cef-v2 | grep -q 'not found'; then
            ldd build/bin/chatgpt-cef-v2 | grep 'not found'
            exit 1
          fi

      - name: Record binary hash
        run: |
          sha256sum build/bin/chatgpt-cef-v2 | tee build/BINARY_SHA256.txt
          sha256sum .deps/downloads/*.tar.bz2 | tee build/CEF_ARCHIVE_SHA256.txt

      - name: Native X11 companion and lifecycle test with sandbox intact
        run: |
          [[ "$(id -u)" -ne 0 ]] || { echo 'Refusing root browser execution'; exit 30; }
          companion_ci_sandbox=$(realpath build/bin/chrome-sandbox)
          [[ "$companion_ci_sandbox" == "$GITHUB_WORKSPACE/build/bin/chrome-sandbox" ]] || { echo 'Sandbox target outside staged build'; exit 31; }
          sudo chown root:root "$companion_ci_sandbox"
          sudo chmod 4755 "$companion_ci_sandbox"
          sha256sum -c build/BINARY_SHA256.txt
          companion_ci_profile=$(mktemp -d /tmp/cgwa-companion-ci.XXXXXX)
          [[ "$companion_ci_profile" == /tmp/cgwa-companion-ci.* && -d "$companion_ci_profile" && ! -L "$companion_ci_profile" ]] || exit 32
          trap 'rm -rf -- "$companion_ci_profile"' EXIT
          mkdir -p .qa
          set +e
          xvfb-run -a timeout 18 build/bin/chatgpt-cef-v2 \
            --cgwa-profile-dir="$companion_ci_profile" --background-test \
            --log-file="$companion_ci_profile/chrome_debug.log" \
            --self-test --companion-self-test --shutdown-self-test \
            '--host-resolver-rules=MAP * ~NOTFOUND' \
            >.qa/companion-native-runtime.out 2>&1
          companion_ci_rc=$?
          set -e
          if [[ -f "$companion_ci_profile/chrome_debug.log" ]]; then
            cp "$companion_ci_profile/chrome_debug.log" .qa/companion-native-chrome.log
          fi
          [[ "$companion_ci_rc" -eq 0 ]] || { echo "NATIVE_RUNTIME_FAIL rc=$companion_ci_rc"; exit 34; }
          [[ -f .qa/companion-native-chrome.log ]] || { echo 'Native log missing'; exit 35; }
          grep -q 'CGWA_COMPANION_SELFTEST PASS' .qa/companion-native-chrome.log
          grep -q 'CGWA_SELFTEST PASS' .qa/companion-native-chrome.log
          grep -q 'CGWA_SHUTDOWN FINALIZE' .qa/companion-native-chrome.log
          grep -q 'CGWA_SHUTDOWN WINDOW_DESTROYED' .qa/companion-native-chrome.log
          if grep -Eq 'FATAL|GPU process isn.t usable|segfault|stack smashing|trap|CGWA_COMPANION_SELFTEST FAIL' .qa/companion-native-chrome.log; then
            echo 'Native runtime error marker; gate failed'
            exit 33
          fi
          echo 'COMPANION_NATIVE_RUNTIME=PASS (isolated unauthenticated profile; no session/tool authority claim)'

      - name: Preserve native runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-native-runtime-evidence
          path: .qa/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-cef-v2-linux-build
          path: |
            build/bin/
            build/BINARY_SHA256.txt
            build/CEF_ARCHIVE_SHA256.txt
          if-no-files-found: error
          retention-days: 7


  windows-native-preview:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and verify pinned Windows CEF
        run: |
          $ErrorActionPreference='Stop'
          $url='https://cef-builds.spotifycdn.com/cef_binary_154.0.32%2Bg682c378%2Bchromium-154.0.8037.58_windows64_minimal.tar.bz2'
          $archive=Join-Path $env:RUNNER_TEMP 'cef-windows64.tar.bz2'
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $archive $url
          if($LASTEXITCODE -ne 0){ throw "CEF_DOWNLOAD_FAIL:$LASTEXITCODE" }
          $item=Get-Item -LiteralPath $archive
          if($item.Length -ne 172827308){ throw "CEF_SIZE_MISMATCH:$($item.Length)" }
          $sha=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -ne 'aa1f7ab28005307edcc13f95e3ce5cd9d221894b00458fb5e368c00603204a2a'){ throw "CEF_SHA256_MISMATCH:$sha" }
          New-Item -ItemType Directory -Force -Path .deps | Out-Null
          tar -xjf $archive -C .deps
          if($LASTEXITCODE -ne 0){ throw "CEF_EXTRACT_FAIL:$LASTEXITCODE" }
          $root=Get-ChildItem .deps -Directory | Where-Object Name -like 'cef_binary_*_windows64_minimal' | Select-Object -First 1
          if(-not $root){ throw 'CEF_ROOT_MISSING' }
          Move-Item -LiteralPath $root.FullName -Destination .deps\cef
          "CEF_ROOT=$((Resolve-Path .deps\cef).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure native Windows preview without sandbox acceptance
        run: |
          $ErrorActionPreference='Stop'
          cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 -DCEF_ROOT="$env:CEF_ROOT" -DUSE_SANDBOX=OFF
          if($LASTEXITCODE -ne 0){ throw "CMAKE_CONFIGURE_FAIL:$LASTEXITCODE" }

      - name: Build native Windows preview
        run: |
          $ErrorActionPreference='Stop'
          cmake --build build-windows --config Release --parallel 2
          if($LASTEXITCODE -ne 0){ throw "WINDOWS_BUILD_FAIL:$LASTEXITCODE" }
          $exe=Get-ChildItem build-windows -Recurse -Filter chatgpt-cef-v2.exe | Select-Object -First 1
          if(-not $exe){ throw 'WINDOWS_EXE_MISSING' }
          $sha=(Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "WINDOWS_PREVIEW_EXE=$($exe.FullName)"
          "WINDOWS_PREVIEW_SHA256=$sha"

      - name: Exercise NTFS owner-private snapshot guard
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'cef-private-guard'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $root
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $user=[Security.Principal.WindowsIdentity]::GetCurrent().User
          $system=New-Object Security.Principal.SecurityIdentifier('S-1-5-18')
          $admins=New-Object Security.Principal.SecurityIdentifier('S-1-5-32-544')
          function Set-PrivateAcl([string]$path,[bool]$directory) {
            if($directory){ $acl=New-Object Security.AccessControl.DirectorySecurity }
            else { $acl=New-Object Security.AccessControl.FileSecurity }
            $acl.SetOwner($user)
            $acl.SetAccessRuleProtection($true,$false)
            $inherit=if($directory){[Security.AccessControl.InheritanceFlags]'ContainerInherit,ObjectInherit'}else{[Security.AccessControl.InheritanceFlags]::None}
            foreach($sid in @($user,$system,$admins)){
              $rule=New-Object Security.AccessControl.FileSystemAccessRule(
                $sid,[Security.AccessControl.FileSystemRights]::FullControl,
                $inherit,[Security.AccessControl.PropagationFlags]::None,
                [Security.AccessControl.AccessControlType]::Allow)
              [void]$acl.AddAccessRule($rule)
            }
            Set-Acl -LiteralPath $path -AclObject $acl
          }
          Set-PrivateAcl $root $true
          [IO.File]::WriteAllText((Join-Path $root 'commander-binding.json'),'{"binding":true}',(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $root 'commander-companion-0000000000001000-00000000-0000-4000-8000-000000000001.json'),'{"snapshot":1}',(New-Object Text.UTF8Encoding($false)))
          [IO.File]::WriteAllText((Join-Path $root 'commander-companion-0000000000002000-00000000-0000-4000-8000-000000000002.json'),'{"snapshot":2}',(New-Object Text.UTF8Encoding($false)))
          Get-ChildItem -LiteralPath $root -File | ForEach-Object { Set-PrivateAcl $_.FullName $false }
          $test=Get-ChildItem build-windows -Recurse -Filter windows-private-file-test.exe | Select-Object -First 1
          if(-not $test){ throw 'WINDOWS_PRIVATE_TEST_EXE_MISSING' }
          & $test.FullName $root
          if($LASTEXITCODE -ne 0){ throw "WINDOWS_PRIVATE_GUARD_FAIL:$LASTEXITCODE" }
          $binding=Join-Path $root 'commander-binding.json'
          $acl=Get-Acl -LiteralPath $binding
          $world=New-Object Security.Principal.SecurityIdentifier('S-1-1-0')
          $rule=New-Object Security.AccessControl.FileSystemAccessRule($world,'Read','Allow')
          $acl.AddAccessRule($rule)
          Set-Acl -LiteralPath $binding -AclObject $acl
          & $test.FullName $root --expect-binding-reject
          if($LASTEXITCODE -ne 0){ throw "WINDOWS_BROAD_ACL_REJECT_FAIL:$LASTEXITCODE" }

      - name: Upload unsigned Windows preview build
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-cef-v2-windows-preview
          path: build-windows/bin/
          if-no-files-found: error
          retention-days: 7

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-release-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build curl bzip2 cppcheck \
            libgtk-3-dev libnss3-dev libx11-dev libxcomposite-dev \
            libxdamage-dev libxext-dev libxfixes-dev libxrandr-dev \
            libgbm-dev libpango1.0-dev libcups2-dev libdrm-dev \
            libasound2-dev fonts-vazirmatn

      - name: Static QA
        run: ./scripts/static-qa.sh

      - name: Fetch pinned CEF
        run: ./scripts/fetch-cef.sh

      - name: Build release
        run: ./scripts/build-release.sh

      - name: Dependency check
        run: |
          if ldd build/bin/chatgpt-cef-v2 | grep -q 'not found'; then
            ldd build/bin/chatgpt-cef-v2 | grep 'not found'
            exit 1
          fi

      - name: Record binary hash
        run: sha256sum build/bin/chatgpt-cef-v2 | tee build/BINARY_SHA256.txt

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-cef-v2-linux-build
          path: |
            build/bin/
            build/BINARY_SHA256.txt
          if-no-files-found: error
          retention-days: 7
